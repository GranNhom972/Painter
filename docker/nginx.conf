# nginx de l'image Docker : sert la version web de Paint (dossier ui/).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/wasm
               application/manifest+json image/svg+xml;

    # L'interface est mise à jour sur place : le navigateur revalide toujours, et
    # le service worker en garde une copie pour le mode hors ligne.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # 'wasm-unsafe-eval' : moteur WebAssembly ; blob:/data: : miniatures des calques,
    # curseurs des outils ; styles en ligne : tailles du menu Taille.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Types exacts exigés par le navigateur (compilation en flux, installation PWA).
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;
    }
    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
    }
}
